name: Terraform Apply (CPU-only GKE)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_CPU_ONLY to authorize creating billable GKE resources'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-gke-state
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ inputs.confirmation == 'DEPLOY_CPU_ONLY' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize GCS remote backend
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Save CPU-only infrastructure plan
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="gpu_node_count=0" \
            -out=tfplan

      - name: Apply saved plan
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Show resource outputs
        run: terraform output
