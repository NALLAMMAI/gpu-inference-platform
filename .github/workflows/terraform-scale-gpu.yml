name: Scale NVIDIA L4 GPU Node Pool

on:
  workflow_dispatch:
    inputs:
      gpu_node_count:
        description: 'Desired L4 GPU worker nodes (0 = off, 1 = on and billable)'
        required: true
        type: choice
        options:
          - '0'
          - '1'
      confirmation:
        description: 'Type SCALE_GPU to confirm the selected GPU node count'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-gke-state
  cancel-in-progress: false

jobs:
  scale-gpu:
    if: ${{ inputs.confirmation == 'SCALE_GPU' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize GCS remote backend
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Save infrastructure plan for selected GPU count
        env:
          GPU_NODE_COUNT: ${{ inputs.gpu_node_count }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -var="project_id=$GCP_PROJECT_ID" \
            -var="gpu_node_count=$GPU_NODE_COUNT" \
            -out=tfplan

      - name: Apply saved plan
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Show resource outputs
        run: terraform output
