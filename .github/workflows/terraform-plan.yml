name: Terraform Plan (GKE)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-gke-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize remote state
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Preview CPU-only GKE infrastructure
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="gpu_node_count=0" \
            -no-color
