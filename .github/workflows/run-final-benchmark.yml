name: Run Final vLLM Benchmark

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_BENCHMARK; runs the official benchmark inside the existing GKE vLLM GPU pod"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-gke-state
  cancel-in-progress: false

jobs:
  benchmark:
    if: "${{ inputs.confirmation == 'RUN_BENCHMARK' }}"
    # GitHub-hosted runner orchestrates; vllm bench serve executes in the existing GKE GPU pod.
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    env:
      RUN_ID: l4-qwen-${{ github.run_id }}
      RESULTS: benchmarks/final-benchmark/results
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Connect to existing GKE cluster
        run: |
          gcloud container clusters get-credentials gpu-inference-learning \
            --zone us-central1-a --project "${{ vars.GCP_PROJECT_ID }}"
      - name: Confirm GPU node and vLLM are ready (no resources created)
        run: |
          set -euo pipefail
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready node \
            -l cloud.google.com/gke-nodepool=gpu-l4-pool --timeout=30s
          kubectl rollout status deployment/learning-vllm --timeout=45s
          kubectl get svc learning-vllm
      - uses: azure/setup-helm@v4
      - name: Install monitoring and Pushgateway
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add gpu-helm-charts https://nvidia.github.io/dcgm-exporter/helm-charts
          helm repo update
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            -n monitoring -f monitoring/stack-values.yaml --wait --timeout 12m
          kubectl apply -f monitoring/vllm-servicemonitor.yaml
          helm upgrade --install dcgm-exporter gpu-helm-charts/dcgm-exporter \
            --version 4.8.4 --reset-values \
            -n monitoring -f monitoring/dcgm-values.yaml \
            --set-file customMetrics=monitoring/dcgm-basic.csv \
            --wait --timeout 8m
          helm upgrade --install benchmark-pushgateway prometheus-community/prometheus-pushgateway \
            -n monitoring -f benchmarks/final-benchmark/pushgateway-values.yaml \
            --wait --timeout 6m
      - name: Install benchmark metrics publisher
        run: python3 -m pip install --disable-pip-version-check --quiet prometheus-client
      - name: Run official vLLM benchmark inside existing GPU serving pod
        env:
          BASE_URL: http://127.0.0.1:8000
          MODEL: Qwen/Qwen3-0.6B
          PUBLISHER_SCRIPT: benchmarks/final-benchmark/publish-metrics.py
          PUSHGATEWAY_URL: 127.0.0.1:9091
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"

          # Only the Pushgateway needs a local tunnel: vLLM client executes
          # in the serving pod and contacts the server via localhost.
          kubectl port-forward -n monitoring \
            svc/benchmark-pushgateway-prometheus-pushgateway 9091:9091 \
            --address=127.0.0.1 > /tmp/pushgateway-portforward.log 2>&1 &
          PUSH_PF=$!
          trap 'kill "$PUSH_PF" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:9091/-/healthy >/dev/null; then
              READY=1
              break
            fi
            sleep 3
          done
          if [[ "$READY" -ne 1 ]]; then
            cat /tmp/pushgateway-portforward.log
            exit 1
          fi

          # Executed inside the EXISTING inference pod, not on an extra GPU,
          # not in a second benchmark pod, and not on the CPU node.
          POD=$(kubectl get pods -n default -l app.kubernetes.io/instance=learning \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [[ -z "$POD" ]]; then
            POD=$(kubectl get pod -n default -o name | grep '/learning-vllm-' | head -n 1 | cut -d/ -f2)
          fi
          test -n "$POD"
          echo "Running official vLLM benchmark inside $POD (shared serving GPU)"
          REMOTE_DIR="/tmp/final-benchmark-$RUN_ID"
          kubectl exec -n default "$POD" -- mkdir -p "$REMOTE_DIR"

          LEVELS=(1 2 4 8 16 32)
          for i in "${!LEVELS[@]}"; do
            c="${LEVELS[$i]}"
            echo "=== concurrency=$c: 128 requests, input=512, output=256 ==="
            kubectl exec -n default "$POD" -- vllm bench serve \
              --backend openai-chat \
              --endpoint /v1/chat/completions \
              --base-url "$BASE_URL" \
              --model "$MODEL" \
              --dataset-name random \
              --random-input-len 512 \
              --random-output-len 256 \
              --num-prompts 128 \
              --request-rate inf \
              --max-concurrency "$c" \
              --percentile-metrics ttft,tpot \
              --metric-percentiles 95 \
              --save-result \
              --result-dir "$REMOTE_DIR" \
              --result-filename "concurrency-$c.json"

            # Stream each finished JSON result directly into GitHub runner storage
            # before continuing. Failure still preserves earlier completed levels.
            kubectl exec -n default "$POD" -- \
              cat "$REMOTE_DIR/concurrency-$c.json" > "$RESULTS/concurrency-$c.json"
            python3 "$PUBLISHER_SCRIPT" \
              --results-dir "$RESULTS" \
              --run-id "$RUN_ID" \
              --gateway "$PUSHGATEWAY_URL"

            if (( i + 1 < ${#LEVELS[@]} )); then
              echo "Cooldown for 180 seconds"
              sleep 180
            fi
          done
      - name: Archive JSON and CSV as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-vllm-benchmark-${{ github.run_id }}
          path: benchmarks/final-benchmark/results/
          if-no-files-found: warn
          retention-days: 30
