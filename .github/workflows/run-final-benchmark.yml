name: Run Final vLLM Benchmark

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_BENCHMARK; requires running GKE vLLM and a separate registered GPU runner"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-gke-state
  cancel-in-progress: false

jobs:
  benchmark:
    if: "${{ inputs.confirmation == 'RUN_BENCHMARK' }}"
    # Register a separate GPU-equipped machine (e.g. RunPod) with this label.
    # The GPU node serving vLLM on GKE stays unchanged.
    runs-on: [self-hosted, linux, x64, gpu-benchmark]
    timeout-minutes: 100
    permissions:
      contents: read
      id-token: write
    env:
      RUN_ID: l4-qwen-${{ github.run_id }}
      RESULTS: benchmarks/final-benchmark/results
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Connect to existing GKE cluster
        run: |
          gcloud container clusters get-credentials gpu-inference-learning \
            --zone us-central1-a --project "${{ vars.GCP_PROJECT_ID }}"
      - name: Confirm GPU node and vLLM are ready (no resources created)
        run: |
          set -euo pipefail
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready node \
            -l cloud.google.com/gke-nodepool=gpu-l4-pool --timeout=30s
          kubectl rollout status deployment/learning-vllm --timeout=45s
          kubectl get svc learning-vllm
      - uses: azure/setup-helm@v4
      - name: Install monitoring and Pushgateway
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add gpu-helm-charts https://nvidia.github.io/dcgm-exporter/helm-charts
          helm repo update
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            -n monitoring -f monitoring/stack-values.yaml --wait --timeout 12m
          kubectl apply -f monitoring/vllm-servicemonitor.yaml
          helm upgrade --install dcgm-exporter gpu-helm-charts/dcgm-exporter \
            --version 4.8.4 --reset-values \
            -n monitoring -f monitoring/dcgm-values.yaml \
            --set-file customMetrics=monitoring/dcgm-basic.csv \
            --wait --timeout 8m
          helm upgrade --install benchmark-pushgateway prometheus-community/prometheus-pushgateway \
            -n monitoring -f benchmarks/final-benchmark/pushgateway-values.yaml \
            --wait --timeout 6m
      - name: Verify separate GPU benchmark runner
        run: |
          set -euo pipefail
          nvidia-smi
          command -v vllm
          command -v python3
          command -v kubectl
          vllm --version
          python3 -m pip install -q prometheus-client
          echo "Benchmark is running outside GKE on a dedicated GPU-enabled self-hosted runner."
      - name: Run official vLLM bench serve via authenticated GKE tunnels
        env:
          BASE_URL: http://127.0.0.1:8000
          MODEL: Qwen/Qwen3-0.6B
          RESULT_DIR: benchmarks/final-benchmark/results
          PUSHGATEWAY_URL: 127.0.0.1:9091
          PUBLISHER_SCRIPT: benchmarks/final-benchmark/publish-metrics.py
          PUBLISH_RUN_ID: ${{ env.RUN_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"

          # Tunnels are bound only to the runner's loopback interface;
          # neither the vLLM service nor Pushgateway is publicly exposed.
          kubectl port-forward -n default svc/learning-vllm 8000:8000 \
            --address=127.0.0.1 > /tmp/vllm-portforward.log 2>&1 &
          VLLM_PF=$!
          kubectl port-forward -n monitoring svc/benchmark-pushgateway-prometheus-pushgateway 9091:9091 \
            --address=127.0.0.1 > /tmp/pushgateway-portforward.log 2>&1 &
          PUSH_PF=$!
          trap 'kill "$VLLM_PF" "$PUSH_PF" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/v1/models >/dev/null &&
               curl -fsS --max-time 3 http://127.0.0.1:9091/-/healthy >/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          if [[ "$ready" -ne 1 ]]; then
            cat /tmp/vllm-portforward.log /tmp/pushgateway-portforward.log
            exit 1
          fi

          bash benchmarks/final-benchmark/run-concurrency-sweep.sh
      - name: Archive JSON and CSV as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-vllm-benchmark-${{ github.run_id }}
          path: benchmarks/final-benchmark/results/
          if-no-files-found: warn
          retention-days: 30
