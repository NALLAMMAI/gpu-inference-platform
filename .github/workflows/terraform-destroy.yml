name: Terraform Destroy (GKE)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DESTROY_GKE to permanently delete the Terraform-managed GKE cluster and node pools'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-gke-state
  cancel-in-progress: false

jobs:
  destroy:
    if: ${{ inputs.confirmation == 'DESTROY_GKE' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize GCS remote backend
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Save destroy plan
        run: |
          terraform plan -destroy -input=false -lock-timeout=5m \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="gpu_node_count=0" \
            -out=tfdestroy

      - name: Destroy resources from saved plan
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfdestroy

      - name: Confirm Terraform state is empty
        run: |
          terraform state list
          if [ -n "$(terraform state list)" ]; then
            echo "::error::Terraform still tracks resources after destroy."
            exit 1
          fi
          echo "Terraform state is empty."
