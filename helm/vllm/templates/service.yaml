apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    # Used by the vLLM ServiceMonitor in monitoring namespace.
    name: {{ .Release.Name }}-vllm
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-vllm
  ports:
    - name: http-metrics
      port: {{ .Values.service.port }}
      targetPort: 8000
