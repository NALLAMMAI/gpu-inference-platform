<text x="600" y="49" text-anchor="middle" class="heading">GKE: gpu-inference-learning (us-central1-a)</text>
<rect x="34" y="73" width="553" height="620" rx="17" fill="#e8f2ff" stroke="#60a5fa" stroke-width="2"/>
<rect x="613" y="73" width="553" height="620" rx="17" fill="#ebf9ed" stroke="#4ade80" stroke-width="2"/>
<text x="56" y="111" class="title">CPU node pool: cpu-pool</text><text x="635" y="111" class="title">GPU node pool: gpu-l4-pool</text>
