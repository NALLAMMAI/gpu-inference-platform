<rect class="box" x="70" y="449" width="475" height="49" rx="9"/><text x="86" y="469" class="sub" font-weight="bold">Prometheus</text><text x="86" y="486" class="tiny">Scrapes and stores metrics</text>
<path class="arrow" d="M307 449 V427"/><text x="320" y="441" class="tiny">queries</text>
<rect class="box" x="70" y="524" width="475" height="48" rx="9"/><text x="86" y="544" class="sub" font-weight="bold">Prometheus Operator</text><text x="86" y="560" class="tiny">Manages monitoring configuration</text>
<rect class="box" x="70" y="594" width="475" height="48" rx="9"/><text x="86" y="615" class="sub" font-weight="bold">Benchmark Pushgateway</text><text x="86" y="631" class="tiny">Stores published concurrency-test metrics</text>
<rect class="box" x="648" y="445" width="482" height="76" rx="9"/><text x="666" y="473" class="sub" font-weight="bold">NVIDIA DCGM Exporter</text><text x="666" y="491" class="tiny">Reads local L4 utilization, VRAM, temperature, power</text>
