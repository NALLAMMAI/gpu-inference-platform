<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="GKE CPU and GPU node pools showing namespaces, workloads, and monitoring connections">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.heading{font-size:25px;font-weight:bold}.title{font-size:19px;font-weight:bold}.sub{font-size:14px}.tiny{font-size:13px}.box{fill:#fff;stroke:#9ca3af;stroke-width:1.3}.ns{fill:#fff;fill-opacity:.65;stroke:#c4c9d3;stroke-width:1.2}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#64748b"/></marker></defs>
