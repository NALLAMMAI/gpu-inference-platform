<text x="635" y="137" class="sub">g2-standard-4 | 4 vCPU | 16 GB RAM | 100 GB disk</text><text x="635" y="158" class="sub">1 × NVIDIA L4 | 24 GB VRAM</text>
<rect class="ns" x="51" y="174" width="518" height="105" rx="12"/><rect class="ns" x="630" y="174" width="518" height="144" rx="12"/>
<text x="67" y="199" class="title">default namespace</text><text x="646" y="199" class="title">default namespace</text>
<rect class="box" x="68" y="214" width="480" height="48" rx="9"/><text x="85" y="234" class="sub" font-weight="bold">learning-gateway-gateway</text><text x="85" y="250" class="tiny">FastAPI HTTP gateway</text>
<rect class="box" x="648" y="213" width="482" height="91" rx="9"/><text x="665" y="237" class="sub" font-weight="bold">learning-vllm</text><text x="665" y="255" class="tiny">vLLM server | Qwen3-0.6B | port 8000</text><text x="665" y="275" class="tiny">vllm bench serve: CPU-heavy client in same pod</text><text x="665" y="292" class="tiny">Shares pod CPU/RAM with inference server</text>
<path class="arrow" d="M548 239 H648"/><rect x="552" y="219" width="91" height="17" fill="#fff"/><text x="598" y="231" text-anchor="middle" font-size="11">HTTP</text>
