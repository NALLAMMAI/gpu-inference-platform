# Helm values for prometheus-community/prometheus-pushgateway.
# Install only after kube-prometheus-stack has created ServiceMonitor CRDs.
# Prometheus selects monitors labeled release: monitoring.
nodeSelector:
  cloud.google.com/gke-nodepool: cpu-pool

service:
  type: ClusterIP

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15s
  honorLabels: true
  additionalLabels:
    release: monitoring
