# NVIDIA DCGM Exporter: collect telemetry on the existing L4 node.
# No nvidia.com/gpu resource request: vLLM retains the GPU allocation.
# GKE rejects system-node-critical priority for ordinary workloads.
priorityClassName: ""

nodeSelector:
  cloud.google.com/gke-nodepool: gpu-l4-pool

tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule

# First diagnostic fix: make the GKE-mounted NVIDIA libraries discoverable.
# This helps only if the runtime actually mounts the libraries into the Pod.
extraEnv:
  - name: LD_LIBRARY_PATH
    value: /usr/local/nvidia/lib64:/usr/local/cuda/lib64:/usr/local/lib

service:
  enable: true
  type: ClusterIP
  port: 9400

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: monitoring

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi
