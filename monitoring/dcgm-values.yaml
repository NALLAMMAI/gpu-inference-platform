# NVIDIA DCGM Exporter: collect telemetry on the existing L4 node.
# No nvidia.com/gpu resource request: vLLM retains the GPU allocation.
# GKE rejects system-node-critical priority for ordinary workloads.
priorityClassName: ""

# Verified on the L4 GKE node: required for NVML initialization.
# Privileged mode grants broad host access; keep limited to this exporter.
securityContext:
  privileged: true
  allowPrivilegeEscalation: true

# Explicitly use the non-DRA path supported by the pinned chart.
kubernetesDRA:
  enabled: false

nodeSelector:
  cloud.google.com/gke-nodepool: gpu-l4-pool

tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule

# First diagnostic fix: make the GKE-mounted NVIDIA libraries discoverable.
# This helps only if the runtime actually mounts the libraries into the Pod.
extraEnv:
  - name: LD_LIBRARY_PATH
    value: /usr/local/nvidia/lib64:/usr/local/cuda/lib64:/usr/local/lib
  # The chart creates exporter-metrics-volume, but does not mount it
  # in the exporter pod. Point the collector to the mounted CSV.
  - name: DCGM_EXPORTER_COLLECTORS
    value: /etc/dcgm-exporter/custom-metrics/default-counters.csv

# GKE COS driver path: expose NVIDIA libraries to the exporter, read-only.
# Confirm this host path is populated on the GPU node if exporter still fails.
extraHostVolumes:
  - name: nvidia-driver-host
    hostPath: /home/kubernetes/bin/nvidia

extraVolumeMounts:
  - name: nvidia-driver-host
    mountPath: /usr/local/nvidia
    readOnly: true
  # Use a separate directory to avoid overwriting the image's default CSV.
  # The chart's default values create exporter-metrics-volume from
  # exporter-metrics-config-map, whose key is mounted as default-counters.csv.
  - name: exporter-metrics-volume
    mountPath: /etc/dcgm-exporter/custom-metrics
    readOnly: true

service:
  enable: true
  type: ClusterIP
  port: 9400

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: monitoring

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi
