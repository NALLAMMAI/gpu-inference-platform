<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" role="img" aria-labelledby="title desc">
<title id="title">vLLM running and waiting requests</title>
<desc id="desc">Successive sampled phases: running requests zero, three, four, three, zero. Waiting requests are zero in all shown samples. Phases are not evenly spaced in time.</desc>
<rect width="780" height="350" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif">
<text x="35" y="43" font-size="24" font-weight="700" fill="#0f172a">vLLM scheduler observations</text>
<text x="35" y="67" font-size="14" fill="#64748b">Running vs waiting requests · sampled states, not a time-aligned trace</text>
<line x1="94" y1="277" x2="732" y2="277" stroke="#e2e8f0"/><text x="75" y="282" text-anchor="end" font-size="13" fill="#475569">0</text><line x1="94" y1="242" x2="732" y2="242" stroke="#e2e8f0"/><text x="75" y="247" text-anchor="end" font-size="13" fill="#475569">1</text><line x1="94" y1="207" x2="732" y2="207" stroke="#e2e8f0"/><text x="75" y="212" text-anchor="end" font-size="13" fill="#475569">2</text><line x1="94" y1="172" x2="732" y2="172" stroke="#e2e8f0"/><text x="75" y="177" text-anchor="end" font-size="13" fill="#475569">3</text><line x1="94" y1="137" x2="732" y2="137" stroke="#e2e8f0"/><text x="75" y="142" text-anchor="end" font-size="13" fill="#475569">4</text><line x1="94" y1="102" x2="732" y2="102" stroke="#e2e8f0"/><text x="75" y="107" text-anchor="end" font-size="13" fill="#475569">5</text>
<text x="105" y="304" text-anchor="middle" font-size="13" fill="#475569">Idle</text><text x="256" y="304" text-anchor="middle" font-size="13" fill="#475569">Initial</text><text x="407" y="304" text-anchor="middle" font-size="13" fill="#475569">Admitted</text><text x="558" y="304" text-anchor="middle" font-size="13" fill="#475569">Short done</text><text x="709" y="304" text-anchor="middle" font-size="13" fill="#475569">Finished</text>
<polyline points="105,277 256,172 407,137 558,172 709,277" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="105,277 256,277 407,277 558,277 709,277" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="105" cy="277" r="6" fill="#0f766e" stroke="#fff" stroke-width="2"/><text x="105" y="263" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">0</text><circle cx="256" cy="172" r="6" fill="#0f766e" stroke="#fff" stroke-width="2"/><text x="256" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">3</text><circle cx="407" cy="137" r="6" fill="#0f766e" stroke="#fff" stroke-width="2"/><text x="407" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">4</text><circle cx="558" cy="172" r="6" fill="#0f766e" stroke="#fff" stroke-width="2"/><text x="558" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">3</text><circle cx="709" cy="277" r="6" fill="#0f766e" stroke="#fff" stroke-width="2"/><text x="709" y="263" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">0</text>
<rect x="155" y="326" width="12" height="12" rx="2" fill="#0f766e"/><text x="174" y="337" font-size="12" fill="#475569">Running</text>
<rect x="284" y="326" width="12" height="12" rx="2" fill="#2563eb"/><text x="303" y="337" font-size="12" fill="#475569">Waiting (0 sampled)</text>
</g></svg>
